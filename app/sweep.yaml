program: sweep.py
command:
  - "..\\.venv\\Scripts\\python.exe"
  - ${program}
  - ${args}
method: bayes
metric:
  name: cv_mae_kcal_mol
  goal: minimize
parameters:
  log_lambda:
    min: -20.0
    max: 5.0
  n_folds:
    values: [5, 10]
  seed:
    values: [0, 7, 42]
early_terminate:
  type: hyperband
  min_iter: 5
